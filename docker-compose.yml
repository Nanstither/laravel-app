# production docker-compose.yml
services:
  app:
    image: 3meenosez/laravel-app:${BUILD_NUMBER:-latest}  # 👈 используем готовый образ
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - laravel_network
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel_network

  webserver:
    image: nginx:alpine
    ports:
      - "8084:80"
    # volumes:
    #   - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel_network

volumes:
  dbdata:

networks:
  laravel_network:
    driver: bridge
